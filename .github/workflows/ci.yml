name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  presentation:
    uses: edbfi/automation/.github/workflows/bun.yml@v4.0.0
    with:
      version: 1.4.2
      install-directory: presentations/fra-eksempler-til-sprogmodeller
      working-directory: presentations/fra-eksempler-til-sprogmodeller
      command: bun run check && bun run build && bun run smoke:install --with-deps && bun run test:smoke
      timeout-minutes: 15
  required:
    name: ci / required
    if: always()
    needs: [presentation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: edbfi/automation/actions/gate@v4.0.0
        with:
          needs: ${{ toJSON(needs) }}
          required: presentation
